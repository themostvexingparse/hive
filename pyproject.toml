[project]
name = "hive"
version = "0.1.0"
description = "Hive: multi-agent harness for subscription-based coding CLIs"
readme = "README.md"
authors = [
    { name = "themostvexingparse", email = "kerbalgalactic@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "mcp>=2.3.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "tomli-w>=1.2.0",
]

[project.scripts]
hive = "hive.cli:main"

[project.optional-dependencies]
mysql = [
    "pymysql>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
